[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saas-sdk-python"
version = "0.1.0"
description = "Python SDK for the saas accounts API: generated protobuf bindings + gateway-bound facade. Consumed by solutions; never vendored."
readme = "README.md"
requires-python = ">=3.10"
# Pinned to the 5.x gencode floor the bindings are generated with; stays
# installable alongside consumers still on protobuf 5.x (and works on 6/7).
# cryptography supplies Ed25519 Work Context signature verification.
dependencies = ["protobuf>=5.29.3", "cryptography>=41", "googleapis-common-protos>=1.66"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]
revision-connect = ["httpx>=0.27,<1"]
revision-grpc = ["grpcio>=1.66"]
module-authority = ["httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"saas_sdk" = ["py.typed"]
"saas_sdk._gen" = ["*.pyi"]
